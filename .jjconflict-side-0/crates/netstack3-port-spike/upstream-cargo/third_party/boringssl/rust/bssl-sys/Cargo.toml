[package]
name = "bssl-sys"
workspace = "../../../../src/connectivity/network/netstack3"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
links = "bssl"
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
bssl-macros = { path = "../../src/rust/bssl-macros" }

[build-dependencies]
cc = "1"
cmake = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bindgen_rs_file)', 'cfg(unsupported_inline_wrappers)'] }
