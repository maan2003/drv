[package]
name = "mt7921-passive-scan"
description = "Guarded physical MT7921 transport for the pinned Fuchsia passive scan adapter"
edition = "2024"
license = "GPL-2.0-only"
version = "0.1.0"

[workspace]
resolver = "3"

[features]
fuchsia-passive = []
default = ["fuchsia-passive"]

[dependencies]
mt7921-port-spike = { path = "../mt7921-port-spike" }
mt7921-softmac-adapter = { path = "../mt7921-softmac-adapter" }
fuchsia-softmac-port = { path = "../../reference/fuchsia-1e1219e3fac944c9a906aea9646939746b6062b3/src/connectivity/wlan/lib/softmac-port" }

[[bin]]
name = "mt7921-passive-scan"
path = "src/main.rs"
