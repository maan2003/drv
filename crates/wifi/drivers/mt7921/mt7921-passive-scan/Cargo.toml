[package]
name = "mt7921-passive-scan"
description = "Typed MT7921 service with same-process MLME/SME"
edition = "2024"
license = "GPL-2.0-only"
version = "0.1.0"

[workspace]
resolver = "3"

[dependencies]
tokio = { version = "=1.52.3", features = ["rt", "net", "time"] }
libc = "=0.2.189"
linux-self-sandbox = { path = "../../../../platform/linux-self-sandbox" }
mt7921-production-client = { path = "../mt7921-production-client" }
wlan-softmac-host = { path = "../../../wlan-softmac-host" }
wifi-control-service = { path = "../../../wifi-control-service" }
fidl-fuchsia-wlan-common = { path = "../../../../../reference/fuchsia-1e1219e3fac944c9a906aea9646939746b6062b3/sdk/fidl/fuchsia.wlan.common" }
fidl-fuchsia-wlan-mlme = { path = "../../../../../reference/fuchsia-1e1219e3fac944c9a906aea9646939746b6062b3/sdk/fidl/fuchsia.wlan.mlme" }
fuchsia-inspect = { path = "../../../../../reference/fuchsia-1e1219e3fac944c9a906aea9646939746b6062b3/src/lib/diagnostics/inspect/rust" }
wlan-sme = { path = "../../../../../reference/fuchsia-1e1219e3fac944c9a906aea9646939746b6062b3/src/connectivity/wlan/lib/sme" }
futures = "=0.3.32"

[[bin]]
name = "mt7921-passive-scan"
path = "src/main.rs"

[patch.crates-io]
trust-dns-proto = { path = "../../../../../reference/fuchsia-1e1219e3fac944c9a906aea9646939746b6062b3/third_party/rust_crates/forks/trust-dns-proto-0.22.0" }
trust-dns-resolver = { path = "../../../../../reference/fuchsia-1e1219e3fac944c9a906aea9646939746b6062b3/third_party/rust_crates/forks/trust-dns-resolver-0.22.0" }
