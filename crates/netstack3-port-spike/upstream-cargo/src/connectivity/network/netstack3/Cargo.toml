[workspace]
resolver = "3"
members = [
  "cargo/net-types-macros", "cargo/net-declare-macros", "cargo/net-declare-portable", "cargo/port-integration",
  "../../wlan/lib/statemachine", "../../wlan/lib/statemachine/macro",
  "../../wlan/lib/bitfield", "../../wlan/lib/bitfield/wlan-bitfield-tests",
  "../../wlan/lib/ieee80211", "../../../../sdk/fidl/fuchsia.wlan.common",
  "../../../../sdk/fidl/fuchsia.wlan.ieee80211",
  "../../../../sdk/fidl/fuchsia.wlan.internal",
  "../../../../sdk/fidl/fuchsia.wlan.mlme",
  "../../../../sdk/fidl/fuchsia.wlan.sme",
  "../../../../sdk/fidl/fuchsia.wlan.softmac",
  "../../wlan/lib/frame_writer/macro",
  "../dhcpv4/client/core", "../dhcpv4/protocol",
  "../../../../third_party/rust_crates/forks/trust-dns-proto-0.22.0",
  "../../../../third_party/rust_crates/forks/trust-dns-resolver-0.22.0",
  "../../lib/net-types", "../../lib/internet-checksum", "../../lib/packet-formats",
  "../lib/diagnostics-traits", "../lib/explicit", "../../../lib/network/packet",
  "../../../lib/replace-with", "core", "core/base", "core/datagram", "core/device",
  "core/filter", "core/hashmap", "core/icmp_echo", "core/ip", "core/lock-order",
  "core/macros", "core/sync", "core/teststd", "core/tcp", "core/trace", "core/udp",
]

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
version = "0.1.0"

[workspace.dependencies]
# Pinned Fuchsia production DHCP/DNS implementations.
dhcp_client_core = { path = "../dhcpv4/client/core" }
dhcp_protocol = { package = "dhcp-protocol", path = "../dhcpv4/protocol" }
trust-dns-proto = { path = "../../../../third_party/rust_crates/forks/trust-dns-proto-0.22.0", default-features = false, features = ["testing"] }
trust-dns-resolver = { path = "../../../../third_party/rust_crates/forks/trust-dns-resolver-0.22.0", default-features = false, features = ["testing"] }

arc-swap = { version = "=1.9.1", features = ["weak"] }
arrayvec = "=0.7.6"
arbitrary = { version = "=1.4.2", features = ["derive"] }
anyhow = "=1.0.102"
assert_matches = "=1.5.0"
async-trait = "=0.1.89"
bitflags = { version = "=2.13.0", features = ["std"] }
bstr = "=1.12.1"
byteorder = "=1.5.0"
cfg-if = "=1.0.4"
criterion = { version = "=0.2.11", default-features = false }
derivative = { version = "=2.2.0", features = ["use_core"] }
derive_builder = "=0.20.2"
either = "=1.15.0"
futures = "=0.3.32"
futures-io = "=0.3.32"
hex = "=0.4.3"
hmac = "=0.13.0"
log = { version = "=0.4.29", features = ["kv", "std"] }
lru-cache = "=0.1.2"
once_cell = "=1.21.3"
num-derive = "=0.4.2"
num-traits = "=0.2.19"
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
quote = "=1.0.45"
rand = { version = "=0.9.4", features = ["small_rng"] }
serde = { version = "=1.0.228", features = ["derive"] }
rand_xorshift = "=0.4.0"
ref-cast = "=1.0.25"
sha2 = "=0.11.0"
siphasher = "=1.0.2"
smallvec = { version = "=1.15.1", features = ["const_generics", "const_new", "union"] }
static_assertions = "=1.1.0"
strum = "=0.28.0"
strum_macros = "=0.28.0"
syn = { version = "=2.0.119", features = ["full", "visit", "visit-mut", "extra-traits"] }
synstructure = "=0.13.2"
thiserror = "=2.0.18"
zerocopy = { version = "=0.8.48", features = ["derive", "simd"] }
net_types = { path = "../../lib/net-types" }
net_types_macros = { path = "cargo/net-types-macros" }
net_declare = { path = "cargo/net-declare-portable" }
net_declare_macros = { path = "cargo/net-declare-macros" }
internet_checksum = { path = "../../lib/internet-checksum" }
ieee80211 = { path = "../../wlan/lib/ieee80211" }
packet_formats = { path = "../../lib/packet-formats" }
diagnostics_traits = { path = "../lib/diagnostics-traits" }
explicit = { path = "../lib/explicit" }
packet = { path = "../../../lib/network/packet" }
replace_with = { path = "../../../lib/replace-with" }
wlan_bitfield = { package = "wlan-bitfield", path = "../../wlan/lib/bitfield" }
wlan_statemachine = { package = "wlan-statemachine", path = "../../wlan/lib/statemachine" }
netstack3_base = { path = "core/base" }
netstack3_datagram = { path = "core/datagram" }
netstack3_device = { path = "core/device" }
netstack3_filter = { path = "core/filter" }
netstack3_hashmap = { path = "core/hashmap" }
netstack3_icmp_echo = { path = "core/icmp_echo" }
netstack3_ip = { path = "core/ip" }
lock_order = { path = "core/lock-order" }
netstack3_macros = { path = "core/macros" }
netstack3_sync = { path = "core/sync" }
netstack3_tcp = { path = "core/tcp" }
netstack3_trace = { path = "core/trace" }
teststd = { path = "core/teststd" }
netstack3_udp = { path = "core/udp" }

[patch.crates-io]
trust-dns-proto = { path = "../../../../third_party/rust_crates/forks/trust-dns-proto-0.22.0" }
trust-dns-resolver = { path = "../../../../third_party/rust_crates/forks/trust-dns-resolver-0.22.0" }
