[package]
name = "mt7921-port-spike"
description = "Exploratory, hardware-independent mt76/mt7921 format ports"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
userspace-vfio = { path = "../userspace-vfio" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "mt7921-scan"
path = "src/bin/scan.rs"

[[bin]]
name = "mt7921-vfio-read"
path = "src/bin/vfio_read.rs"

[[bin]]
name = "mt7921-firmware-inspect"
path = "src/bin/firmware_inspect.rs"
