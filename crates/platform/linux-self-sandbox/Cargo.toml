[package]
name = "linux-self-sandbox"
description = "Linux self-sandbox boundary for WLAN policy services"
edition = "2024"
license = "GPL-2.0-only"
version = "0.1.0"

[workspace]
resolver = "3"

[features]
filter-integration-test = []

[dependencies]
seccompiler = { version = "=0.5.0", default-features = false }
libc = "0.2"
userspace-vfio = { path = "../userspace-vfio" }

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["rt", "net", "time"] }

[[bin]]
name = "mt-hashmap-filter-probe"
path = "src/bin/mt-hashmap-filter-probe.rs"
required-features = ["filter-integration-test"]
