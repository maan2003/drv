[package]
name = "wlan-softmac-host"
description = "Chip-generic synchronous host contract for the pinned Fuchsia client SoftMAC boundary"
edition = "2024"
license = "GPL-2.0-only"
version = "0.1.0"

[workspace]
resolver = "3"

[dependencies]
anyhow = "=1.0.102"
